.card.fbhid{opacity:.72;border-style:dashed}

async function rawCall(action, body, url) {
  let r;
  try {
    r = await fetch(url || FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + S.access_token },
      body: JSON.stringify(Object.assign({}, body, { action })), cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
  } catch (_) { return { ok: false, code: 'NETWORK' }; }
  let d = null;
  try { d = await r.json(); } catch (_) {}

    if (!d.ok && (typeof d.code !== 'string' || !/^[A-Z_]{2,30}$/.test(d.code))) d.code = 'SERVER';
    return d;
  }

}
async function api(action, body, quiet, url) {
  if (!S) return { ok: false, code: 'AUTH' };
  if (S.expires_at - Date.now() < 60000) {
    const rr = await refresh();
    if (rr === 'dead') { endSession(ERR.AUTH); return { ok: false, code: 'AUTH' }; }
  }
  let res = await rawCall(action, body || {}, url);
  if (!res.ok && res.code === 'AUTH' && S) {
    const rr = await refresh();
    if (rr === 'ok') res = await rawCall(action, body || {}, url);
  }
  if (res.ok) return res;
  if (res.code === 'AUTH') endSession(ERR.AUTH);
  else if (res.code === 'FORBIDDEN' && !url) endSession(ERR.FORBIDDEN);
  else if (res.code === 'MFA_REQUIRED') { toast('برای ادامه، ورود دومرحله‌ای رو انجام بده.', 'err'); startMfa(); }
  else if (!quiet || !quiet.includes(res.code)) toast(errMsg(res.code), 'err');
  return res;
}

    showWho && (e.email || e.user_id) ? h('div', { class: 'who' }, e.user_id && UUID.test(String(e.user_id)) ? h('a', { href: '#/user/' + String(e.user_id).toLowerCase(), class: 'ltr', text: String(e.email || e.user_id) }) : String(e.email || '')) : null,
    det ? h('pre', { class: 'json', text: det.length > 4000 ? det.slice(0, 4000) + '…' : det }) : null);
}

/* ======= رویدادها ======= */
const ES = { kind: '', page: 0 };
function viewEvents() {
  const my = gen;
  const sel = h('select', { class: 'in', 'aria-label': 'نوع رویداد' }, h('option', { value: '', text: 'همه‌ی رویدادها' }));
  for (const k of Object.keys(KINDS)) sel.append(h('option', { value: k, text: KINDS[k][0], selected: ES.kind === k }));
  const list = h('div', { class: 'card' });
  const pager = h('div', { class: 'pager' });
  sel.addEventListener('change', () => { ES.kind = KINDS[sel.value] ? sel.value : ''; ES.page = 0; load(); });
  view.append(h('div', { class: 'head' }, h('h2', { text: 'رویدادها' })), h('div', { class: 'toolbar' }, sel), list, pager);
  let req = 0;
  async function load() {
    const id = ++req;
    clear(list); clear(pager); list.append(loading());
    const r = await api('events', { kind: ES.kind, page: ES.page });
    if (my !== gen || id !== req) return;
    clear(list);
    if (!r.ok) { list.append(failBox(load)); return; }
    const rows = Array.isArray(r.rows) ? r.rows : [];
    if (!rows.length) list.append(h('div', { class: 'muted', text: 'رویدادی نیست.' }));
    rows.forEach((e) => list.append(evRow(e, true)));
    if (ES.page > 0 || rows.length >= 50) {
      pager.append(
        h('button', { class: 'btn sm', type: 'button', text: '→ جدیدتر', disabled: ES.page <= 0, on: { click: () => { ES.page--; load(); window.scrollTo(0, 0); } } }),
        h('span', { text: 'صفحه‌ی ' + n(ES.page + 1) }),
        h('button', { class: 'btn sm', type: 'button', text: 'قدیمی‌تر ←', disabled: rows.length < 50, on: { click: () => { ES.page++; load(); window.scrollTo(0, 0); } } }));
    }
  }
  load();
}

/* ======= نظرها (تجربه‌های کاربرها) ======= */
const FS = { kind: '', st: 'all' };
const FK = { bug: ['🐞 مشکل / باگ', 'blk'], good: ['👍 نکته‌ی مثبت', 'pro'], story: ['✨ تجربه‌ی جالب', 'free'] };
function viewFeedback() {
  const my = gen;
  let items = [], more = false, req = 0, isAdm = true;
  const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'فیلتر نوع' });
  const chips2 = h('div', { class: 'chips', role: 'group', 'aria-label': 'فیلتر وضعیت' });
  const list = h('div', { class: 'list' });
  const moreBox = h('div', { class: 'pager' });
  const count = h('span', { class: 'muted small' });
  const mk = (box, arr, key) => {
    for (const [k, t] of arr) {
      const c = h('button', { class: 'chip' + (FS[key] === k ? ' on' : ''), type: 'button', text: t, 'aria-pressed': String(FS[key] === k), on: { click: () => {
        if (FS[key] === k) return;
        FS[key] = k;
        for (const x of box.children) { const on = x === c; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); }
        if (key === 'kind') load(true); else draw();
      } } });
      box.append(c);
    }
  };
  mk(chips, [['', 'همه‌ی نوع‌ها'], ['bug', '🐞 مشکل‌ها'], ['good', '👍 مثبت‌ها'], ['story', '✨ تجربه‌ها']], 'kind');
  mk(chips2, [['all', 'همه'], ['noreply', 'بدون پاسخ'], ['hidden', 'پنهان‌شده (گزارش)']], 'st');
  view.append(h('div', { class: 'head' }, h('h2', { text: 'نظرها' }), count), h('div', { class: 'toolbar' }, chips, chips2), list, moreBox);

  function card(it) {
    const k = FK[it.kind] || FK.story;
    const c = h('div', { class: 'card fbc' + (it.hidden ? ' fbhid' : '') });
    const meta = h('div', { class: 'fbmeta' },
      h('span', { class: 'badge ' + k[1], text: k[0] }),
      h('b', { text: String(it.name || '') }),
      h('span', { text: dt(it.at) }));
    if (it.hidden) meta.append(h('span', { class: 'badge blk', text: 'پنهان · ' + n(it.reports) + ' گزارش' }));
    else if (Number(it.reports) > 0) meta.append(h('span', { class: 'badge free', text: n(it.reports) + ' گزارش' }));
    c.append(meta, h('div', { class: 'fbb', text: String(it.body || '') }));
    if (it.reply) c.append(h('div', { class: 'fbrep' }, h('small', { text: 'پاسخ شب‌بان' + (it.replyAt ? ' · ' + dt(it.replyAt) : '') }), h('div', { class: 'fbb', text: String(it.reply) })));
    const ta = h('textarea', { class: 'in', dir: 'auto', rows: 3, maxLength: 600, placeholder: 'پاسخ شب‌بان رو بنویس…', value: String(it.reply || ''), 'aria-label': 'پاسخ' });
    const send = h('button', { class: 'btn gold sm', type: 'button', text: it.reply ? 'ویرایش پاسخ' : 'ثبت پاسخ' });
    send.addEventListener('click', () => busy(send, async () => {
      const text = ta.value.trim();
      if (!text) { toast('اول متن پاسخ رو بنویس.', 'err'); return; }
      const r = await fbApi('reply', { id: it.id, text });
      if (!r.ok) return;
      it.reply = text; it.replyAt = Date.now();
      toast('پاسخ ثبت شد ✓', 'ok');
      c.replaceWith(card(it));
    }));
    const btns = h('div', { class: 'btns' }, send);
    if (it.reply) {
      const delR = h('button', { class: 'btn ghost sm', type: 'button', text: 'حذف پاسخ' });
      delR.addEventListener('click', async () => {
        if (!await confirmBox('حذف پاسخ', 'فقط پاسخ شب‌بان پاک می‌شه و نظر کاربر می‌مونه.', 'حذف پاسخ', true)) return;
        await busy(delR, async () => {
          const r = await fbApi('reply', { id: it.id, text: '' });
          if (!r.ok) return;
          it.reply = ''; it.replyAt = 0; toast('پاسخ حذف شد.', 'ok'); c.replaceWith(card(it));
        });
      });
      btns.append(delR);
    }
    if (it.hidden) {
      const rs = h('button', { class: 'btn green sm', type: 'button', text: 'نمایش دوباره' });
      rs.addEventListener('click', () => busy(rs, async () => {
        const r = await fbApi('restore', { id: it.id });
        if (!r.ok) return;
        it.hidden = false; it.reports = 0; toast('نظر دوباره نمایش داده می‌شه.', 'ok'); c.replaceWith(card(it)); count.textContent = n(items.length) + ' نظر';
      }));
      btns.append(rs);
    }
    const del = h('button', { class: 'btn red sm', type: 'button', text: '🗑 حذف نظر' });
    del.addEventListener('click', async () => {
      if (!await confirmBox('حذف نظر', 'این نظر برای همیشه پاک می‌شه و قابل برگشت نیست.', 'حذف', true)) return;
      await busy(del, async () => {
        const r = await fbApi('delete', { id: it.id });
        if (!r.ok) return;
        items = items.filter((x) => x.id !== it.id);
        toast('نظر حذف شد.', 'ok'); c.remove(); count.textContent = n(items.length) + ' نظر';
        if (!list.children.length) draw();
      });
    });
    btns.append(del);
    c.append(h('label', { class: 'f' }, h('span', { text: it.reply ? 'ویرایش پاسخ' : 'پاسخ به این نظر' }), ta), btns);
    return c;
  }
  function draw() {
    clear(list);
    const rows = items.filter((it) => FS.st === 'noreply' ? !it.reply : FS.st === 'hidden' ? !!it.hidden : true);
    count.textContent = n(items.length) + ' نظر بارگذاری شد';
    if (!rows.length) list.append(h('div', { class: 'empty', text: items.length ? 'نظری با این فیلتر نیست (شاید در صفحه‌های قدیمی‌تر باشه).' : 'هنوز نظری ثبت نشده.' }));
    rows.forEach((it) => list.append(card(it)));
    clear(moreBox);
    if (more) moreBox.append(h('button', { class: 'btn sm', type: 'button', text: 'نمایش قدیمی‌ترها', on: { click: (e) => busy(e.currentTarget, () => load(false)) } }));
  }
  async function load(reset) {
    const id = ++req;
    if (reset) { items = []; clear(list); clear(moreBox); list.append(loading()); }
    const r = await fbApi('list', { kind: FS.kind || undefined, before: reset || !items.length ? undefined : items[items.length - 1].id });
    if (my !== gen || id !== req) return;
    if (!r.ok) { clear(list); list.append(failBox(() => load(true))); return; }
    isAdm = !!(r.me && r.me.admin);
    if (!isAdm) { clear(list); list.append(h('div', { class: 'empty', text: 'این حساب در فهرست مدیرها نیست؛ پاسخ و حذف کار نمی‌کنه.' })); }
    items = items.concat(Array.isArray(r.items) ? r.items : []);
    more = !!r.more;
    draw();
  }
  load(true);
}

/* ======= تنظیمات ======= */
async function viewSettings() {
  const my = gen;
  view.append(h('div', { class: 'head' }, h('h2', { text: 'تنظیمات' })), loading());
  const r = await api('settings_get');
  if (my !== gen) return;
  view.lastChild.remove();
  if (!r.ok) { view.append(failBox(route)); }
  else {
    const field = (label, inp, hintTxt) => { const hn = h('div', { class: 'hint' }, h('span', { text: hintTxt || '' })); return [h('label', { class: 'f' }, h('span', { text: label }), inp), hn]; };
    const price = h('input', { class: 'in ltr', type: 'text', inputMode: 'numeric', maxLength: 9, value: String(Number(r.price) || 0) });
    const dl = h('input', { class: 'in ltr', type: 'number', inputMode: 'numeric', min: 1, max: 5, step: 1, value: String(Number(r.device_limit) || 2) });
    const gd = h('input', { class: 'in ltr', type: 'number', inputMode: 'numeric', min: 1, max: 30, step: 1, value: String(Number(r.grace_days) || 7) });
    const an = h('textarea', { class: 'in', dir: 'auto', maxLength: 200, rows: 3, value: typeof r.announce === 'string' ? r.announce : '', placeholder: 'مثلاً: تخفیف ویژه‌ی آخر هفته!' });
    const priceTxt = h('span');
    const anCnt = h('span');
    const updP = () => { price.value = toLatinDigits(price.value).replace(/\D/g, '').slice(0, 9); priceTxt.textContent = price.value ? n(price.value) + ' تومان' : ''; };
    const updA = () => { anCnt.textContent = n(an.value.length) + ' از ۲۰۰'; };
    price.addEventListener('input', updP); an.addEventListener('input', updA);
    [dl, gd].forEach((x) => x.addEventListener('input', () => { const v = toLatinDigits(x.value).replace(/\D/g, ''); if (v !== x.value) x.value = v; }));
    updP(); updA();
    const f1 = field('قیمت نسخه‌ی پرو (تومان)', price); f1[1].append(priceTxt);
    const f2 = field('سقف دستگاه برای هر حساب', dl, 'بین ۱ تا ۵');
    const f3 = field('روزهای آفلاین مجاز', gd, 'بین ۱ تا ۳۰ روز — بعدش برنامه باید دوباره به سرور وصل بشه');
    const f4 = field('اعلان برای کاربران', an, 'حداکثر ۲۰۰ نویسه؛ به‌صورت متن ساده نشون داده می‌شه'); f4[1].append(anCnt);
    const err = h('div', { class: 'hint err' });
    const save = h('button', { class: 'btn gold', type: 'button', text: 'ذخیره‌ی تنظیمات' });
    save.style.marginTop = '14px';
    save.addEventListener('click', async () => {
      [price, dl, gd, an].forEach((x) => x.classList.remove('err'));
      const v = { price: Number(price.value), device_limit: Number(dl.value), grace_days: Number(gd.value), announce: an.value.replace(/[<>]/g, '').trim() };
      const bad = [];
      if (!price.value || !Number.isInteger(v.price) || v.price < 0 || v.price > 100000000) { price.classList.add('err'); bad.push('قیمت'); }
      if (!Number.isInteger(v.device_limit) || v.device_limit < 1 || v.device_limit > 5) { dl.classList.add('err'); bad.push('سقف دستگاه'); }
      if (!Number.isInteger(v.grace_days) || v.grace_days < 1 || v.grace_days > 30) { gd.classList.add('err'); bad.push('روزهای آفلاین'); }
      if (v.announce.length > 200) { an.classList.add('err'); bad.push('اعلان'); }
      if (bad.length) { err.textContent = 'این موارد درست نیستن: ' + bad.join('، '); return; }
      err.textContent = '';
      const sum = 'قیمت: ' + n(v.price) + ' تومان · سقف دستگاه: ' + n(v.device_limit) + ' · آفلاین مجاز: ' + n(v.grace_days) + ' روز' + (v.announce ? ' · اعلان: «' + v.announce + '»' : ' · بدون اعلان');
      if (!await confirmBox('ذخیره‌ی تنظیمات', sum + '\nاین تغییرات برای همه‌ی کاربران اعمال می‌شه.', 'ذخیره')) return;
      busy(save, async () => { const x = await api('settings_set', v); if (x.ok) toast('تنظیمات ذخیره شد.', 'ok'); });
    });
    view.append(h('div', { class: 'card' }, f1, f2, f3, f4, err, save));
  }
  // پسورد
  {
    const p1 = h('input', { class: 'in ltr', type: 'password', name: 'new-password', autocomplete: 'new-password', maxLength: 128, placeholder: 'پسورد جدید (حداقل ۱۲ نویسه)' });
    const p2 = h('input', { class: 'in ltr', type: 'password', name: 'new-password2', autocomplete: 'new-password', maxLength: 128, placeholder: 'تکرار پسورد' });
    const ph = h('div', { class: 'hint err' });
    const pb = h('button', { class: 'btn gold', type: 'button', text: 'ذخیره‌ی پسورد' });
    pb.style.marginTop = '14px';
    pb.addEventListener('click', () => {
      p1.classList.remove('err'); p2.classList.remove('err'); ph.textContent = ''; ph.className = 'hint err';
      const a = p1.value, b = p2.value;
      if (a.length < 12) { p1.classList.add('err'); ph.textContent = 'پسورد باید حداقل ۱۲ نویسه باشه.'; return; }
      if (a.length > 128) { p1.classList.add('err'); ph.textContent = 'پسورد خیلی بلنده (حداکثر ۱۲۸).'; return; }
      if (!/[A-Za-z؀-ۿ]/.test(a) || !/\d/.test(a)) { p1.classList.add('err'); ph.textContent = 'پسورد باید هم حرف داشته باشه هم عدد.'; return; }
      if (a.toLowerCase().includes((myEmail.split('@')[0] || '@@').toLowerCase())) { p1.classList.add('err'); ph.textContent = 'پسورد نباید شامل اسم ایمیلت باشه.'; return; }
      if (a !== b) { p2.classList.add('err'); ph.textContent = 'تکرار پسورد با پسورد یکی نیست.'; return; }
      busy(pb, async () => {
        if (!S) return;
        const r = await gt('/user', { method: 'PUT', token: S.access_token, body: { password: a } });
        if (r.status === 401) { endSession(ERR.AUTH); return; }
        if (!r.ok) { ph.textContent = gtErr(r, 'ذخیره‌ی پسورد انجام نشد؛ دوباره امتحان کن.'); return; }
        p1.value = ''; p2.value = '';
        toast('پسورد ذخیره شد. دفعه‌ی بعد با ایمیل + پسورد + کد برنامه وارد شو.', 'ok');
      });
    });
    view.append(h('div', { class: 'card' }, h('h3', { text: 'پسورد ورود' }),
      h('p', { class: 'muted small', text: 'با پسورد، دیگه هر بار ایمیل نمی‌ره. ورود = ایمیل + پسورد + کد Authenticator. پسوردی بذار که جای دیگه استفاده نکردی.' }),
      h('label', { class: 'f' }, h('span', { text: 'پسورد جدید' }), p1), h('label', { class: 'f' }, h('span', { text: 'تکرار' }), p2), ph, pb));
  }
  // کلید عمومی
  const pkCard = h('div', { class: 'card' }, h('h3', { text: 'کلید عمومی لایسنس' }),
    h('p', { class: 'muted small', text: 'این کلید عمومیه و امن؛ باید برای برنامه‌نویس فرستاده بشه تا داخل برنامه قرار بگیره و برنامه بتونه لایسنس‌هایی که سرور امضا می‌کنه رو بررسی کنه.' }));
  const pkBody = h('div');
  const pkBtn = h('button', { class: 'btn', type: 'button', text: 'نمایش کلید عمومی' });
  pkBtn.addEventListener('click', () => busy(pkBtn, async () => {
    const x = await api('pubkey');
    if (my !== gen || !x.ok) return;
    clear(pkBody);
    if (!x.pub || typeof x.pub !== 'object') { pkBody.append(h('div', { class: 'muted small', text: 'هنوز کلیدی ساخته نشده (اولین درخواست لایسنس، کلید رو می‌سازه).' })); return; }
    const txt = JSON.stringify({ kty: x.pub.kty, crv: x.pub.crv, x: x.pub.x, y: x.pub.y });
    const cb = h('button', { class: 'btn sm gold', type: 'button', text: 'کپی', on: { click: () => copyText(txt, cb) } });
    pkBody.append(h('div', { class: 'pk mono', text: txt }), cb);
  }));
  pkCard.append(pkBody, pkBtn);
  view.append(pkCard);
}

/* ======= شروع ======= */
function boot() {
  if (!SB_KEY) { showSetup(); return; }
  S = loadSess();
  let act = 0;
  try { act = Number(sessionStorage.getItem(AKEY)) || 0; } catch (_) {}
  if (S && (!act || Date.now() - act > IDLE_MS)) { endSession(act ? 'به‌خاطر ۳۰ دقیقه بی‌فعالیتی، از حساب خارج شدی.' : null); return; }
  lastAct = act || Date.now();
  if (!S) { showLogin(); return; }
  schedRefresh();
  authFrame('', 'در حال بارگذاری…');
  if (aal() === 'aal2') enterApp(); else startMfa();
}
boot();
})();
</script>
